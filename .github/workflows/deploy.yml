name: Déployer sur GitHub Pages

on:
  push:
    branches: [main, refonte]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          PUBLIC_SUPABASE_URL: 'https://waqaeyclhwhnnmvlfoau.supabase.co'
          # Projet Supabase du site. Clé publique (protégée par la RLS), sans risque dans le code.
          # Ne pas la remplacer par une variable GitHub : une mauvaise valeur casse les comptes.
          PUBLIC_SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhcWFleWNsaHdobm5tdmxmb2F1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ2MDEyMTYsImV4cCI6MjExMDE3NzIxNn0.Dd8OXAxYr98zB95YHAPIgKXfQ5wriej7mLnZVLP8mv8'
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
