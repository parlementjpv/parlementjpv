name: Déployer les fonctions Supabase

# Redéploie les fonctions serveur (supabase/functions) à chaque modification.
# Nécessite le secret GitHub SUPABASE_ACCESS_TOKEN (jeton personnel Supabase du compte propriétaire du projet).
on:
  push:
    branches: [main, refonte]
    paths: ['supabase/functions/**', 'supabase/config.toml']
  workflow_dispatch:

concurrency:
  group: functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Jeton présent ?
        id: jeton
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Secret SUPABASE_ACCESS_TOKEN absent : fonctions non déployées."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.jeton.outputs.ok == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - if: steps.jeton.outputs.ok == 'true'
        run: supabase functions deploy --project-ref waqaeyclhwhnnmvlfoau --use-api --yes
